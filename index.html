<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Master Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-active: rgba(255, 255, 255, 0.06);
      --text: #f1f5f9;
      --muted: #64748b;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --p1: #f43f5e;
      --p1-bg: rgba(244, 63, 94, 0.12);
      --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 18px 90px; min-height: 100vh; }

    header { margin-bottom: 24px; }
    .badge-timeline {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      display: inline-block;
      margin-bottom: 6px;
    }
    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }

    /* Progress Glass Card */
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
    }
    .progress-header { display: flex; justify-content: space-between; align-items: baseline; }
    .progress-val { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .progress-label { font-size: 0.8rem; color: var(--muted); }
    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-top: 14px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      box-shadow: 0 0 12px var(--accent-glow);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Category Pill Selector */
    .pill-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; scrollbar-width: none; }
    .pill-scroll::-webkit-scrollbar { display: none; }
    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pill.active {
      background: #fff;
      color: #090a0f;
      font-weight: 600;
      border-color: #fff;
      box-shadow: 0 4px 15px rgba(255,255,255,0.15);
    }

    /* Task Item Styling */
    .task {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .task:active { transform: scale(0.99); background: var(--card-active); }

    /* Custom Checkbox */
    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .task.done .check-box {
      background: #6366f1;
      border-color: #6366f1;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .check-box svg { display: none; width: 12px; height: 12px; stroke: #fff; stroke-width: 3; fill: none; }
    .task.done .check-box svg { display: block; }

    .task-content { flex: 1; }
    .task-title { font-size: 0.92rem; font-weight: 500; line-height: 1.4; color: #e2e8f0; transition: color 0.2s; }
    .task.done .task-title { text-decoration: line-through; color: #475569; }

    .tag-p1 {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--p1);
      background: var(--p1-bg);
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 1px 6px;
      border-radius: 6px;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-timeline">Sep – Nov 2026</div>
    <h1>Prep & Thesis Tracker</h1>
  </header>

  <div class="glass-card">
    <div class="progress-header">
      <div>
        <div class="progress-label">Milestone Completion</div>
        <div class="progress-val" id="pct">0%</div>
      </div>
      <div id="fraction" style="font-size: 0.85rem; color: var(--muted); font-weight: 500;">0 / 0</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="fill"></div>
    </div>
  </div>

  <div class="pill-scroll">
    <button class="pill active" onclick="setFilter('all', this)">All</button>
    <button class="pill" onclick="setFilter('gre', this)">GRE</button>
    <button class="pill" onclick="setFilter('thesis', this)">Thesis</button>
    <button class="pill" onclick="setFilter('ielts', this)">IELTS</button>
    <button class="pill" onclick="setFilter('apps', this)">USA & Abroad</button>
  </div>

  <div id="taskList"></div>

  <script>
    const items = [
      // GRE (Priority #1)
      { id: "g1", cat: "gre", text: "Module 12 (Quant + Verbal + Writing)", p1: true },
      { id: "g2", cat: "gre", text: "OMSP Week-1 Day-7 (Test must)", p1: true },
      { id: "g3", cat: "gre", text: "Analyze test result", p1: true },
      { id: "g4", cat: "gre", text: "OMSP Verbal: W-3 (Day 4–7) & W-4 (Day 1–7)", p1: true },
      { id: "g5", cat: "gre", text: "Dedicated grammar for the GRE", p1: false },
      { id: "g6", cat: "gre", text: "Strategy Drill – Verbal (all)", p1: false },
      { id: "g7", cat: "gre", text: "Strategy Drill – Quant (all)", p1: false },
      { id: "g8", cat: "gre", text: "OMSP Quant: W-4 (Day 1–7)", p1: false },
      { id: "g9", cat: "gre", text: "Powerprep Mock exam", p1: false },
      { id: "g10", cat: "gre", text: "Analyze Mock result and decide", p1: false },

      // IELTS
      { id: "i1", cat: "ielts", text: "Speaking practice (30 min each day)", p1: false },

      // Thesis (Priority #1)
      { id: "t1", cat: "thesis", text: "Draft: Write Introduction", p1: true },
      { id: "t2", cat: "thesis", text: "Draft: Write Background", p1: true },
      { id: "t3", cat: "thesis", text: "Draft: Write Methodology", p1: true },
      { id: "t4", cat: "thesis", text: "Collect reference papers", p1: true },
      { id: "t5", cat: "thesis", text: "Collect Data (200/300 at least) — Daily 1–2 hrs", p1: true },
      { id: "t6", cat: "thesis", text: "Post-Data: Analyze & write Result section", p1: true },
      { id: "t7", cat: "thesis", text: "Post-Data: Write Discussion section", p1: true },
      { id: "t8", cat: "thesis", text: "Post-Data: Write Conclusion section", p1: true },

      // Applications
      { id: "a1", cat: "apps", text: "Shortlist universities (follow LinkedIn advice)", p1: false },
      { id: "a2", cat: "apps", text: "Decide on PhD topic (after shortlisting)", p1: false },
      { id: "a3", cat: "apps", text: "Message / email professors", p1: false },
      { id: "a4", cat: "apps", text: "Alternative: Erasmus or Germany planning", p1: false }
    ];

    let currentFilter = 'all';

    function setFilter(cat, elem) {
      currentFilter = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      elem.classList.add('active');
      render();
    }

    function toggle(id) {
      const state = JSON.parse(localStorage.getItem('aesthetic_tracker') || '{}');
      state[id] = !state[id];
      localStorage.setItem('aesthetic_tracker', JSON.stringify(state));
      render();
    }

    function render() {
      const state = JSON.parse(localStorage.getItem('aesthetic_tracker') || '{}');
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      const filtered = currentFilter === 'all' ? items : items.filter(i => i.cat === currentFilter);

      filtered.forEach(item => {
        const isDone = !!state[item.id];
        const row = document.createElement('div');
        row.className = `task ${isDone ? 'done' : ''}`;
        row.onclick = () => toggle(item.id);
        row.innerHTML = `
          <div class="check-box">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <div class="task-content">
            <span class="task-title">${item.text}</span>
            ${item.p1 ? '<span class="tag-p1">P1</span>' : ''}
          </div>
        `;
        list.appendChild(row);
      });

      const total = items.length;
      const completed = Object.values(state).filter(Boolean).length;
      const percentage = Math.round((completed / total) * 100);

      document.getElementById('pct').innerText = `${percentage}%`;
      document.getElementById('fraction').innerText = `${completed} / ${total} done`;
      document.getElementById('fill').style.width = `${percentage}%`;
    }

    render();
  </script>
</body>
</html>
